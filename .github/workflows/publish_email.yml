name: Publish Press Release Email

on:
  repository_dispatch:
    types: [new_press_release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Posts Directory
        run: mkdir -p _posts

      - name: Decode, Clean and Save Content
        id: clean_step
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python tools/clean_email.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/
          git add assets/img/posts/ 2>/dev/null || true
          git pull origin master --rebase
          # 嚴格遵循 -s 簽署規範，且不加任何 AI 聯名署名
          git commit -s -m "chore(posts): publish new press release via email dispatch

          Filename: ${{ steps.clean_step.outputs.clean_filename }}
          Triggered by Repository Dispatch event."
          git push origin master
