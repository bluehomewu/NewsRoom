<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  
  <!-- SEO Meta Tags -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>

  <!-- Header Navigation -->
  <header class="site-header" id="main-header">
    <div class="header-container">
      <a href="{{ site.baseurl }}/" class="logo" id="site-logo">
        News<span>Room</span>
      </a>
      <nav class="nav-links" id="main-nav" aria-label="主要導覽">
        <a href="{{ site.baseurl }}/" class="nav-link" id="nav-home">新聞首頁</a>
        <a href="mailto:{{ site.email }}" class="nav-link" id="nav-contact">聯絡發佈</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="site-container" id="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="main-footer">
    <div class="footer-container">
      <div class="footer-text" id="footer-copyright">
        &copy; {{ site.time | date: '%Y' }} NewsRoom 新聞中心. All rights reserved.
      </div>
      <div class="footer-links" id="footer-menu">
        <a href="{{ site.baseurl }}/" class="footer-link" id="footer-link-home">首頁</a>
        <a href="mailto:{{ site.email }}" class="footer-link" id="footer-link-contact">合作信箱</a>
      </div>
    </div>
  </footer>

</body>
</html>
